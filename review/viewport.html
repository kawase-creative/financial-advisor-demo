<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>公開デモの表示幅確認</title><style>body{margin:0;background:#deded9;font-family:sans-serif}header{height:64px;padding:10px 20px;box-sizing:border-box;display:flex;align-items:center;gap:20px}label{font-size:14px}select,button{font-size:16px;padding:6px}iframe{display:block;border:0;margin-left:20px;background:white;width:390px;height:900px}#result{font-size:12px}</style></head><body><header><label for="width">表示幅</label><select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select><button id="measure">レイアウト確認</button><span id="result">公開デモのCSS表示幅を確認する補助ページです</span></header><iframe title="サイト表示" src="../index.html?v=20261011-2"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('select').addEventListener('change',e=>{frame.style.width=e.target.value+'px';});document.querySelector('button').addEventListener('click',()=>{const d=frame.contentDocument;const w=frame.contentWindow;document.querySelector('#result').textContent=JSON.stringify({width:w.innerWidth,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,headingOverflow:[...d.querySelectorAll('h1,h2,h3')].filter(e=>e.scrollWidth>e.clientWidth+1).length});});</script></body></html>
